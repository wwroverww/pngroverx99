<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNG Background Remover</title>

  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .box {
      background: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    .upload {
      margin: 25px 0;
      padding: 35px;
      border: 2px dashed #aaa;
      border-radius: 15px;
      cursor: pointer;
    }

    input {
      display: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 15px;
      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .download-all {
      background: #16a34a;
      margin-top: 20px;
    }

    #status {
      margin: 20px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .item {
      background: #f9fafb;
      border-radius: 15px;
      padding: 12px;
      overflow: hidden;
    }

    .item img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
    }

    .name {
      margin: 10px 0;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">

    <h1>PNG Background Remover</h1>

    <p>تا ١٠ وێنە هەڵبژێرە</p>

    <label class="upload">
      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
      >
      📷 کلیک بکە بۆ هەڵبژاردنی وێنەکان
    </label>

    <div id="status">
      هیچ وێنەیەک هەڵنەبژێردراوە
    </div>

    <button
      id="processBtn"
      onclick="processImages()"
      disabled
    >
      سڕینەوەی پشتەوە
    </button>

    <button
      id="downloadAll"
      class="download-all"
      onclick="downloadAll()"
      disabled
    >
      ⬇️ Download All PNG
    </button>

    <div id="results" class="grid"></div>

  </div>

</div>

<script>

const input = document.getElementById("fileInput");
const processBtn = document.getElementById("processBtn");
const downloadBtn = document.getElementById("downloadAll");
const statusText = document.getElementById("status");
const results = document.getElementById("results");

let selectedFiles = [];
let processedImages = [];

input.addEventListener("change", function () {

  selectedFiles = Array.from(this.files).slice(0, 10);

  if (selectedFiles.length === 0) {
    processBtn.disabled = true;
    statusText.innerText = "هیچ وێنەیەک هەڵنەبژێردراوە";
    return;
  }

  statusText.innerText =
    `${selectedFiles.length} وێنە هەڵبژێردراوە`;

  processBtn.disabled = false;

});


async function processImages() {

  processBtn.disabled = true;
  downloadBtn.disabled = true;

  results.innerHTML = "";
  processedImages = [];

  for (let i = 0; i < selectedFiles.length; i++) {

    const file = selectedFiles[i];

    statusText.innerText =
      `خەریکی پرۆسەکردنی ${i + 1} لە ${selectedFiles.length} ...`;

    try {

      // سڕینەوەی پشتەوە
      const transparentBlob =
        await imglyRemoveBackground(file);

      // دانانی پشتەوەی سپی
      const whiteBlob =
        await addWhiteBackground(transparentBlob);

      const url = URL.createObjectURL(whiteBlob);

      const item = document.createElement("div");
      item.className = "item";

      const img = document.createElement("img");
      img.src = url;

      const name = document.createElement("div");
      name.className = "name";
      name.innerText =
        file.name.replace(/\.[^/.]+$/, "") + ".png";

      const download = document.createElement("button");
      download.innerText = "Download PNG";

      download.onclick = function () {
        downloadFile(
          whiteBlob,
          file.name.replace(/\.[^/.]+$/, "") + ".png"
        );
      };

      item.appendChild(img);
      item.appendChild(name);
      item.appendChild(download);

      results.appendChild(item);

      processedImages.push({
        blob: whiteBlob,
        name:
          file.name.replace(/\.[^/.]+$/, "") + ".png"
      });

    } catch (error) {

      console.error(error);

      statusText.innerText =
        "هەڵەیەک ڕوویدا لە پرۆسەکردنی وێنەکە.";

    }

  }

  statusText.innerText =
    `تەواو بوو ✅ ${processedImages.length} وێنە`;

  processBtn.disabled = false;

  if (processedImages.length > 0) {
    downloadBtn.disabled = false;
  }

}


async function addWhiteBackground(blob) {

  const img = new Image();

  const url = URL.createObjectURL(blob);

  await new Promise((resolve, reject) => {

    img.onload = resolve;
    img.onerror = reject;

    img.src = url;

  });

  const canvas = document.createElement("canvas");

  canvas.width = img.width;
  canvas.height = img.height;

  const ctx = canvas.getContext("2d");

  // پشتی سپی
  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  // وێنەی بێ پشتەوە
  ctx.drawImage(
    img,
    0,
    0
  );

  URL.revokeObjectURL(url);

  return new Promise(resolve => {

    canvas.toBlob(
      resolve,
      "image/png",
      1
    );

  });

}


function downloadFile(blob, filename) {

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


async function downloadAll() {

  for (const image of processedImages) {

    downloadFile(
      image.blob,
      image.name
    );

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );

  }

}

</script>

</body>
</html>
