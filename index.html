

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erest grocery - گۆڕینی وێنە بۆ PNG بە AI</title>
    <!-- کتێبخانەی زیرەکی دەستکرد بۆ لابردنی پاشبنەما -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.0/dist/index.umd.js"></script>
    <!-- کتێبخانەی JSZip بۆ کۆکردنەوەی وێنەکان لەناو فایلێکی Zip دا -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f43f5e;
            --bg-color: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .brand-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .upload-area {
            border: 2px dashed rgba(99, 102, 241, 0.5);
            padding: 45px 20px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(99, 102, 241, 0.03);
        }

        .upload-area:hover {
            background: rgba(99, 102, 241, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .upload-area input {
            display: none;
        }

        .upload-text {
            font-size: 16px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .upload-text span {
            color: #818cf8;
            display: block;
            margin-top: 8px;
            font-size: 13px;
        }

        .actions-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-success:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .status-box {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            max-height: 150px;
            overflow-y: auto;
            color: #38bdf8;
            font-family: monospace;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .preview-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .preview-card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            border-radius: 8px;
            background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%);
            background-size: 12px 12px;
        }

        .preview-card .file-name {
            font-size: 11px;
            margin-top: 8px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: #cbd5e1;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-title">Erest grocery</div>
        <p class="subtitle">  تائبەتە بە رۆڤێر & پەیوەست  </p>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-text">
                 وێنەکان لێرە دابنێ یان کلیک بکە بۆ هەڵبژاردن
                <span>(زۆرترین ١٠ وێنە لە یەک کاتدا)</span>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div id="previewGrid" class="preview-grid"></div>

        <div class="actions-container">
            <button id="processBtn" class="btn" onclick="processImages()" disabled>⚡ دەستپێکردنی پرۆسێسکردنی AI</button>
            <button id="downloadZipBtn" class="btn btn-success" onclick="downloadAllAsZip()" style="display: none;" disabled>📥 داگرتنی هەموویان (ZIP)</button>
        </div>

        <div id="statusBox" class="status-box" style="display: none;"></div>

        <div class="footer">
            دروست کراوی وێبسایت: <span>rover & paiwast</span>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const previewGrid = document.getElementById('previewGrid');
        const statusBox = document.getElementById('statusBox');

        let selectedFiles = [];
        let processedResults = [];

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 10) {
                alert('تکایە لە ١٠ وێنە زیاتر مەخە ناوی   هەڵلمەبژێرە.');
                fileInput.value = '';
                return;
            }

            selectedFiles = files;
            processedResults = [];
            previewGrid.innerHTML = '';
            downloadZipBtn.style.display = 'none';
            
            if (selectedFiles.length > 0) {
                processBtn.disabled = false;
                selectedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const card = document.createElement('div');
                        card.className = 'preview-card';
                        card.innerHTML = `
                            <img src="${e.target.result}" alt="وێنە">
                            <div class="file-name">${file.name}</div>
                        `;
                        previewGrid.appendChild(card);
                    };
                    reader.readAsDataURL(file);
                });
            } else {
                processBtn.disabled = true;
            }
        });

        function logStatus(message) {
            statusBox.style.display = 'block';
            statusBox.innerHTML += `<div>> ${message}</div>`;
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        async function processImages() {
            if (selectedFiles.length === 0) return;

            processBtn.disabled = true;
            fileInput.disabled = true;
            statusBox.innerHTML = '';
            previewGrid.innerHTML = '';
            processedResults = [];

            logStatus('دەستپێکردنی مۆدێلی زیرەکی دەستکرد (AI)... تکایە چاوەڕوان بە.');

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                logStatus(`خەریکی چارەسەرکردنی وێنەی (${i + 1} لە ${selectedFiles.length}): ${file.name}`);

                try {
                    // لابردنی پاشبنەما بە AI
                    const blob = await imglyRemoveBackground(file);
                    const url = URL.createObjectURL(blob);
                    
                    // پاشەکەوتکردن بۆ ناو پاشەکەوتی ZIP
                    processedResults.push({
                        name: file.name.substring(0, file.name.lastIndexOf('.')) || file.name,
                        blob: blob
                    });

                    // نیشاندانەوەی وێنەی پاککراوەوە
                    const card = document.createElement('div');
                    card.className = 'preview-card';
                    card.innerHTML = `
                        <img src="${url}" alt="PNG Result">
                        <div class="file-name" style="color: #38bdf8;">ئامادەیە (PNG)</div>
                    `;
                    previewGrid.appendChild(card);
                    logStatus(`وێنەی (${i + 1}) بە سەرکەوتوویی پاشبنەکەی لادرا.`);
                } catch (error) {
                    console.error(error);
                    logStatus(`هەڵە ڕوویدا لە وێنەی (${i + 1}): ${file.name}`);
                }
            }

            logStatus('پرۆسەکە بە سەرکەوتوویی تەواو بوو! ئێستا دەتوانیت هەموو وێنەکان بەیەکەوە داگریت.');
            processBtn.disabled = false;
            fileInput.disabled = false;

            if (processedResults.length > 0) {
                downloadZipBtn.style.display = 'flex';
                downloadZipBtn.disabled = false;
            }
        }

        async function downloadAllAsZip() {
            if (processedResults.length === 0) return;

            downloadZipBtn.disabled = true;
            downloadZipBtn.innerText = 'خەریکی دروستکردنی فایلی ZIP...';
            logStatus('دەستکرا بە کۆکردنەوەی هەموو وێنەکان لەناو فایلێکی ZIP...');

            const zip = new JSZip();
            const folder = zip.folder("Erest_Grocery_PNGs");

            processedResults.forEach((item, index) => {
                folder.file(`erest-${index + 1}-${item.name}.png`, item.blob);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const zipUrl = URL.createObjectURL(content);

            const link = document.createElement('a');
            link.href = zipUrl;
            link.download = "Erest_Grocery_PNG_Images.zip";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            logStatus('فایلی ZIP بە سەرکەوتوویی دابەزی!');
            downloadZipBtn.disabled = false;
            downloadZipBtn.innerText = '📥 داگرتنی هەموویان (ZIP)';
        }
    </script>
</body>
</html>
