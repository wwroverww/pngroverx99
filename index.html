<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erest grocery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0c14;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 20px 0;
        }
        h1 {
            font-size: 22px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 11px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .drop-zone {
            border: 2px dashed rgba(168, 85, 247, 0.4);
            border-radius: 14px;
            padding: 20px 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.01);
        }
        .drop-zone:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }
        .drop-zone p {
            margin: 0;
            color: #e0e0e0;
            font-size: 12px;
            line-height: 1.6;
        }
        #uploadInput {
            display: none;
        }
        #statusMsg {
            font-size: 11px;
            margin-top: 10px;
            min-height: 15px;
            color: #4ade80;
        }
        .download-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .download-btn {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-family: Tahoma, sans-serif;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .footer {
            margin-top: 25px;
            font-size: 10px;
            color: #777;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Erest grocery</h1>
        <div class="subtitle">وێنە هەڵبژێرە (تا ١٠ وێنە) و دایانبەزێنە</div>

        <div class="drop-zone" onclick="document.getElementById('uploadInput').click()">
            <p>وێنە لێرە دابنی یان کلیک بکە بۆ هەڵبژاردن<br><span style="font-size: 10px; color: #888;">(دەتوانیت چەند وێنەیەک هەڵبژێریت)</span></p>
            <input type="file" id="uploadInput" accept="image/*" multiple>
        </div>

        <div id="statusMsg"></div>
        
        <div id="downloadList" class="download-list"></div>

        <div class="footer">دروستکراوی: rover & paiwast</div>
    </div>

    <script>
        const fileInput = document.getElementById('uploadInput');
        const statusMsg = document.getElementById('statusMsg');
        const downloadList = document.getElementById('downloadList');

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;

            downloadList.innerHTML = '';
            
            // سنوردارکردنی ژمارەکە بۆ زۆرترین ١٠ وێنە لە یەک جاردا
            const count = Math.min(files.length, 10);
            statusMsg.textContent = count + ' وێنە ئامادە کران!';

            for (let i = 0; i < count; i++) {
                const file = files[i];
                const fileURL = URL.createObjectURL(file);
                
                const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || 'image_' + (i + 1);
                
                const btn = document.createElement('a');
                btn.href = fileURL;
                btn.download = baseName + '.png';
                btn.className = 'download-btn';
                btn.textContent = '📥 داونلۆدی: ' + file.name;
                
                downloadList.appendChild(btn);
            }
        });
    </script>
</body>
</html>
