<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erest Grocery</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#080910;
  color:white;
  font-family:Arial,sans-serif;
  padding:25px 12px;
}

.card{
  max-width:760px;
  margin:auto;
  background:#17181f;
  border:1px solid #363741;
  border-radius:28px;
  padding:35px 20px;
  text-align:center;
}

.logo{
  direction:ltr;
  color:#bd55dc;
  font-size:42px;
  font-weight:800;
}

.subtitle{
  color:#bbb;
  font-size:18px;
  margin:12px 0 30px;
}

.upload{
  width:100%;
  border:4px dashed #b14ddd;
  background:#fff;
  color:#111;
  border-radius:25px;
  padding:38px 15px;
}

#fileInput{
  display:none;
}

.selectButton{
  display:inline-block;
  background:#fff;
  color:#111;
  border:0;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
  padding:10px 20px;
}

.small{
  color:#777;
  margin-top:8px;
  font-size:15px;
}

#status{
  min-height:30px;
  margin:22px 0;
  color:#d65be7;
  font-weight:bold;
}

button.action{
  border:0;
  border-radius:13px;
  padding:14px 24px;
  margin:5px;
  color:white;
  background:#b94fda;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.action:disabled{
  opacity:.35;
}

#downloadAll{
  background:#159447;
}

#progress{
  display:none;
  margin-top:20px;
  height:8px;
  background:#292a32;
  border-radius:20px;
  overflow:hidden;
}

#bar{
  height:100%;
  width:0%;
  background:#bd55dc;
  transition:.3s;
}

#results{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:25px;
}

.result{
  background:#292a32;
  padding:12px;
  border-radius:18px;
}

.result img{
  width:100%;
  height:230px;
  object-fit:contain;
  background:#fff;
  border-radius:12px;
}

.filename{
  color:#bbb;
  font-size:13px;
  margin:8px;
  direction:ltr;
  word-break:break-all;
}

.download{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  background:#b94fda;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.footer{
  margin-top:30px;
  color:#777;
  direction:ltr;
}

@media(max-width:600px){

  .logo{
    font-size:34px;
  }

  #results{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<div class="card">

  <div class="logo">
    Erest grocery
  </div>

  <div class="subtitle">
    وێنەکەت بکە بە پشتی سپی
  </div>


  <div class="upload">

    <button
      class="selectButton"
      id="selectButton"
      type="button"
    >
      📁 وێنەکان هەڵبژێرە
    </button>

    <div class="small">
      تا ١٠ وێنە یەکجار
    </div>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

  </div>


  <div id="status">
    هیچ وێنەیەک هەڵنەبژێردراوە
  </div>


  <button
    id="processButton"
    class="action"
    type="button"
    disabled
  >
    ✨ سڕینەوەی پشتەوە
  </button>


  <button
    id="downloadAll"
    class="action"
    type="button"
    disabled
  >
    ⬇️ هەمووی دابەزێنە
  </button>


  <div id="progress">
    <div id="bar"></div>
  </div>


  <div id="results"></div>


  <div class="footer">
    rover & paiwast
  </div>

</div>


<script type="module">

import {
  removeBackground
}
from
"https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


const fileInput =
  document.getElementById("fileInput");

const selectButton =
  document.getElementById("selectButton");

const processButton =
  document.getElementById("processButton");

const downloadAll =
  document.getElementById("downloadAll");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");

const progress =
  document.getElementById("progress");

const bar =
  document.getElementById("bar");


let files = [];

let finished = [];


/* =========================
   OPEN FILE PICKER
========================= */

selectButton.onclick = function(){

  fileInput.click();

};


/* =========================
   SELECT FILES
========================= */

fileInput.addEventListener(
  "change",
  function(){

    files =
      Array.from(
        this.files
      ).slice(0,10);


    results.innerHTML = "";

    finished = [];

    downloadAll.disabled = true;


    if(files.length === 0){

      processButton.disabled = true;

      status.textContent =
        "هیچ وێنەیەک هەڵنەبژێردراوە";

      return;

    }


    processButton.disabled = false;


    status.textContent =
      files.length +
      " وێنە هەڵبژێردراوە ✅";

  }
);


/* =========================
   PROCESS
========================= */

processButton.onclick =
async function(){

  if(files.length === 0){
    return;
  }


  processButton.disabled = true;

  downloadAll.disabled = true;

  results.innerHTML = "";

  finished = [];

  progress.style.display = "block";


  for(
    let i=0;
    i<files.length;
    i++
  ){

    const file = files[i];


    status.textContent =
      "AI خەریکی کارکردنە... " +
      (i+1) +
      " / " +
      files.length;


    bar.style.width =
      ((i/files.length)*100) +
      "%";


    try{


      /* REMOVE BACKGROUND */

      const transparent =
        await removeBackground(
          file,
          {
            model:"isnet",
            output:{
              format:"image/png",
              quality:1
            }
          }
        );


      /* WHITE BACKGROUND */

      const finalBlob =
        await makeWhite(
          transparent
        );


      const name =
        file.name
        .replace(/\.[^/.]+$/,"")
        + ".png";


      const url =
        URL.createObjectURL(
          finalBlob
        );


      showResult(
        url,
        finalBlob,
        name
      );


      finished.push({
        blob:finalBlob,
        name:name
      });


    }
    catch(error){

      console.error(error);

      status.innerHTML =
        "❌ هەڵە لە وێنەی " +
        (i+1) +
        "<br><small>" +
        error.message +
        "</small>";

    }

  }


  bar.style.width = "100%";


  if(finished.length){

    status.textContent =
      "تەواو بوو ✅ " +
      finished.length +
      " وێنە";

    downloadAll.disabled = false;

  }


  processButton.disabled = false;

};


/* =========================
   WHITE BACKGROUND
========================= */

async function makeWhite(blob){

  const url =
    URL.createObjectURL(blob);


  const img =
    new Image();


  await new Promise(
    (resolve,reject)=>{

      img.onload = resolve;

      img.onerror = reject;

      img.src = url;

    }
  );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    img.naturalWidth;

  canvas.height =
    img.naturalHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    img,
    0,
    0
  );


  URL.revokeObjectURL(url);


  return new Promise(
    resolve=>{

      canvas.toBlob(
        resolve,
        "image/png",
        1
      );

    }
  );

}


/* =========================
   SHOW RESULT
========================= */

function showResult(
  url,
  blob,
  name
){

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "result";


  const img =
    document.createElement(
      "img"
    );

  img.src = url;


  const filename =
    document.createElement(
      "div"
    );

  filename.className =
    "filename";

  filename.textContent =
    name;


  const button =
    document.createElement(
      "button"
    );

  button.className =
    "download";

  button.textContent =
    "⬇️ Download PNG";


  button.onclick =
    function(){

      download(
        blob,
        name
      );

    };


  box.appendChild(img);

  box.appendChild(filename);

  box.appendChild(button);


  results.appendChild(box);

}


/* =========================
   DOWNLOAD
========================= */

function download(
  blob,
  name
){

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;

  a.download = name;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(url);
    },
    1000
  );

}


/* =========================
   DOWNLOAD ALL
========================= */

downloadAll.onclick =
async function(){

  for(
    const item of finished
  ){

    download(
      item.blob,
      item.name
    );


    await new Promise(
      r=>setTimeout(r,600)
    );

  }


  status.textContent =
    "هەموو وێنەکان دابەزێنرا ✅";

};

</script>

</body>
</html>
