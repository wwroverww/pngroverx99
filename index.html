<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erest grocery - Images</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0c14;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 11px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .upload-box {
            background: #ffffff;
            border: 2px dashed #a855f7;
            border-radius: 14px;
            padding: 20px 15px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .upload-box p {
            margin: 0;
            color: #111;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.6;
        }
        #fileInput {
            display: none;
        }
        .list-container {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .img-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .img-card img {
            max-width: 100%;
            height: 110px;
            object-fit: contain;
            background: #ffffff; /* پشتەوەی سپی پەتی بۆ وێنەکە */
            border-radius: 8px;
            display: block;
            margin: 0 auto 8px auto;
        }
        .hint {
            font-size: 10px;
            color: #ec4899;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Erest grocery</h1>
        <div class="subtitle">وێنەکانت بە پشتی سپی</div>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📁 وێنەکان لێرە هەڵبژێرە<br><span style="font-size: 9px; color: #555;">(تا ١٠ وێنە بەیەکەوە)</span></p>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div class="hint">💡 پەنجە بنە بەسەر وێنەکەدا و (Add to Photos) بکە</div>

        <div id="fileList" class="list-container"></div>

        <div class="footer">دروستکراوی: rover & paiwast</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;

            fileList.innerHTML = '';
            const limit = Math.min(files.length, 10);

            for (let i = 0; i < limit; i++) {
                const file = files[i];
                const fileUrl = URL.createObjectURL(file);

                const card = document.createElement('div');
                card.className = 'img-card';

                const img = document.createElement('img');
                img.src = fileUrl;

                card.appendChild(img);
                fileList.appendChild(card);
            }
        });
    </script>
</body>
</html>
