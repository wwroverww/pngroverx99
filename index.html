<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erest grocery - گۆڕینی وێنە بۆ PNG بە </title>
    <!--    بۆ لابردنی  چوار چێوەی وێنە  -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.0/dist/index.umd.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg-color: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            text-align: center;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .upload-area {
            border: 2px dashed rgba(99, 102, 241, 0.5);
            padding: 35px 20px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(99, 102, 241, 0.03);
        }

        .upload-area:hover {
            background: rgba(99, 102, 241, 0.08);
            border-color: var(--primary);
        }

        .upload-area input {
            display: none;
        }

        .upload-text {
            font-size: 15px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .upload-text span {
            color: #818cf8;
            display: block;
            margin-top: 6px;
            font-size: 12px;
        }

        .status-box {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            color: #38bdf8;
            font-family: monospace;
            display: none;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-title">Erest grocery</div>
        <p class="subtitle">وێنە هەڵبژێرە و ڕاستەوخۆ بە PNG دایبەزێنە</p>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-text">
                وێنەکان لێرە دابنێ یان کلیک بکە بۆ هەڵبژاردن
                <span>(ڕاستەوخۆ پاشبنەماکەی لادەبرێت و دابەزێت)</span>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div id="statusBox" class="status-box"></div>

        <div class="footer">
            دروستکراوی: rover & paiwast
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusBox = document.getElementById('statusBox');

        function logStatus(message) {
            statusBox.style.display = 'block';
            statusBox.innerHTML = `> ${message}`;
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            logStatus('خەریکی پرۆسێسکردنی وێنەکانە بە AI...');

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    // لابردنی پاشبنەما بە AI
                    const blob = await imglyRemoveBackground(file);
                    const url = URL.createObjectURL(blob);
                    
                    // دروستکردنی ناوی پاککراوە بۆ فایلەکە
                    const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    const fileName = `erest-${originalName}.png`;

                    // داگرتنی ئۆتۆماتیکی ڕاستەوخۆ بۆ ناو مۆبایل
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    logStatus(`وێنەی (${i + 1} لە ${files.length}) بە سەرکەوتوویی دابەزی!`);
                } catch (error) {
                    console.error(error);
                    logStatus(`هەڵە ڕوویدا لە وێنەی: ${file.name}`);
                }
            }

            // پاککردنەوەی ئایپوتەکە بۆ ئەوەی بتوانیت دووبارە هەمان وێنە هەڵبژێریت ئەگەر پێویست کرد
            fileInput.value = '';
        });
    </script>
</body>
</html>
