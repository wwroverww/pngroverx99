<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Erest Grocery — PNG</title>

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#090a12;
color:white;
min-height:100vh;
padding:40px 16px;
}

.card{
max-width:740px;
margin:auto;
background:#171820;
border:1px solid #343640;
border-radius:28px;
padding:38px 30px;
text-align:center;
box-shadow:0 20px 60px #0008;
}

h1{
margin:0;
font-size:38px;
color:#bd55dc;
font-weight:800;
direction:ltr;
}

.subtitle{
color:#aaa;
font-size:17px;
margin:12px 0 28px;
}

.upload{
display:block;
background:white;
color:#111;
border:4px dashed #a64de0;
border-radius:25px;
padding:42px 20px;
cursor:pointer;
font-size:21px;
font-weight:bold;
transition:.2s;
}

.upload:hover{
background:#fafafa;
transform:scale(1.01);
}

.upload small{
display:block;
font-size:15px;
color:#777;
margin-top:10px;
}

input{display:none}

#status{
margin:22px 0;
color:#d65ee8;
font-weight:bold;
}

button{
border:0;
border-radius:13px;
padding:13px 22px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:5px;
background:#bd55dc;
color:white;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.downloadAll{
background:#20a85a;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:25px;
}

.item{
background:#292a32;
border-radius:18px;
padding:14px;
}

.item img{
width:100%;
height:220px;
object-fit:contain;
background:white;
border-radius:12px;
}

.item button{
width:100%;
margin:10px 0 0;
}

.name{
font-size:13px;
color:#bbb;
margin:8px 0;
word-break:break-all;
}

.footer{
margin-top:35px;
color:#777;
font-size:15px;
direction:ltr;
}

@media(max-width:600px){
.card{
padding:30px 18px;
}

h1{
font-size:32px;
}

.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="card">

<h1>Erest grocery</h1>

<div class="subtitle">
وێنەکەت بکە بە پشتی سپی
</div>

<label class="upload">
📁 وێنەکان لێرە هەڵبژێرە
<small>(تا ١٠ وێنە یەکجار)</small>

<input
id="fileInput"
type="file"
accept="image/*"
multiple
>

</label>

<div id="status">
هیچ وێنەیەک هەڵنەبژێردراوە
</div>

<button id="processBtn" disabled>
✨ سڕینەوەی پشتەوە
</button>

<button id="downloadAll" class="downloadAll" disabled>
⬇️ هەمووی دابەزێنە
</button>

<div id="results" class="grid"></div>

<div class="footer">
rover & paiwast
</div>

</div>

<script>

const input=document.getElementById("fileInput");
const processBtn=document.getElementById("processBtn");
const downloadAllBtn=document.getElementById("downloadAll");
const status=document.getElementById("status");
const results=document.getElementById("results");

let files=[];
let processed=[];


input.addEventListener("change",()=>{

files=Array.from(input.files).slice(0,10);

processed=[];
results.innerHTML="";
downloadAllBtn.disabled=true;

if(!files.length){

status.textContent="هیچ وێنەیەک هەڵنەبژێردراوە";
processBtn.disabled=true;
return;

}

status.textContent=`${files.length} وێنە هەڵبژێردراوە ✅`;
processBtn.disabled=false;

});


processBtn.addEventListener("click",async()=>{

processBtn.disabled=true;
downloadAllBtn.disabled=true;
processed=[];
results.innerHTML="";

for(let i=0;i<files.length;i++){

const file=files[i];

status.textContent=
`خەریکی کارکردنە... ${i+1} / ${files.length}`;

try{

/*
سڕینەوەی پشتەوە
*/
const transparent=
await imglyRemoveBackground(file);

/*
دانانی پشتی سپی
*/
const whitePNG=
await whiteBackground(transparent);

const url=URL.createObjectURL(whitePNG);

const box=document.createElement("div");
box.className="item";

const image=document.createElement("img");
image.src=url;

const filename=
file.name.replace(/\.[^/.]+$/,"")+".png";

const name=document.createElement("div");
name.className="name";
name.textContent=filename;

const download=document.createElement("button");
download.textContent="⬇️ Download PNG";

download.onclick=()=>{
downloadBlob(whitePNG,filename);
};

box.appendChild(image);
box.appendChild(name);
box.appendChild(download);

results.appendChild(box);

processed.push({
blob:whitePNG,
name:filename
});

}catch(error){

console.error(error);

status.textContent=
`هەڵەیەک ڕوویدا لە وێنەی ${i+1}`;

}

}

status.textContent=
`تەواو بوو ✅ ${processed.length} وێنە`;

processBtn.disabled=false;

if(processed.length){
downloadAllBtn.disabled=false;
}

});


async function whiteBackground(blob){

const url=URL.createObjectURL(blob);
const image=new Image();

await new Promise((resolve,reject)=>{

image.onload=resolve;
image.onerror=reject;
image.src=url;

});

const canvas=document.createElement("canvas");

canvas.width=image.naturalWidth;
canvas.height=image.naturalHeight;

const ctx=canvas.getContext("2d");

/*
پشتی سپی
*/
ctx.fillStyle="#ffffff";
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

/*
وێنەی بێ پشتەوە
*/
ctx.drawImage(image,0,0);

URL.revokeObjectURL(url);

return new Promise(resolve=>{

canvas.toBlob(
blob=>resolve(blob),
"image/png",
1
);

});

}


function downloadBlob(blob,name){

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download=name;

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

}


downloadAllBtn.addEventListener("click",async()=>{

for(const item of processed){

downloadBlob(
item.blob,
item.name
);

await new Promise(
resolve=>setTimeout(resolve,500)
);

}

});

</script>

</body>
</html>
