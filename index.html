<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erest grocery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0c14;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 11px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .upload-box {
            background: #ffffff; /* پشتی سپی پەتی بۆ سندوقەکە */
            border: 2px dashed #a855f7;
            border-radius: 14px;
            padding: 25px 15px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .upload-box p {
            margin: 0;
            color: #111; /* ڕەنگی ڕەش بۆ ئەوەی لەسەر سپی بەڕوونی دیار بێت */
            font-size: 13px;
            font-weight: bold;
            line-height: 1.6;
        }
        #fileInput {
            display: none;
        }
        .list-container {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 10px;
        }
        .file-name {
            font-size: 11px;
            color: #fff;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .download-btn {
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Erest grocery</h1>
        <div class="subtitle">ئامادەکردنی وێنەکان بۆ داونلۆد</div>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>📁 وێنەکان لێرە هەڵبژێرە<br><span style="font-size: 10px; color: #555;">(تا ١٠ وێنە بەیەکەوە)</span></p>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div id="fileList" class="list-container"></div>

        <div class="footer">دروستکراوی: rover & paiwast</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;

            fileList.innerHTML = '';
            const limit = Math.min(files.length, 10);

            for (let i = 0; i < limit; i++) {
                const file = files[i];
                const fileUrl = URL.createObjectURL(file);

                const item = document.createElement('div');
                item.className = 'file-item';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'file-name';
                nameSpan.textContent = file.name;

                const btn = document.createElement('a');
                btn.href = fileUrl;
                btn.download = file.name;
                btn.className = 'download-btn';
                btn.textContent = 'داونلۆد';

                item.appendChild(nameSpan);
                item.appendChild(btn);
                fileList.appendChild(item);
            }
        });
    </script>
</body>
</html>
