<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erest grocery  </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0c14;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 11px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .drop-zone {
            border: 2px dashed rgba(168, 85, 247, 0.4);
            border-radius: 14px;
            padding: 20px 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.01);
        }
        .drop-zone:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }
        .drop-zone p {
            margin: 0;
            color: #e0e0e0;
            font-size: 12px;
            line-height: 1.6;
        }
        #uploadInput {
            display: none;
        }
        #downloadBtn {
            display: none;
            width: 100%;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-family: Tahoma, sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            text-decoration: none;
            box-sizing: border-box;
        }
        #statusMsg {
            font-size: 11px;
            margin-top: 10px;
            min-height: 15px;
            color: #4ade80;
        }
        .footer {
            margin-top: 25px;
            font-size: 10px;
            color: #777;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Erest grocery</h1>
        <div class="subtitle">وێنە هەڵبژێرە و ڕاستەوخۆ بە PNG دایبەزێنە</div>

        <div class="drop-zone" onclick="document.getElementById('uploadInput').click()">
            <p>وێنە لێرە دابنی یان کلیک بکە بۆ هەڵبژاردن<br><span style="font-size: 10px; color: #888;">(بۆ گۆڕینی فۆرمات)</span></p>
            <input type="file" id="uploadInput" accept="image/*">
        </div>

        <div id="statusMsg"></div>
        
        <a id="downloadBtn" href="#" download="erest_image.png">داونلۆدکردنی PNG 📥</a>

        <div class="footer">دروستکراوی: rover & paiwast</div>
    </div>

    <script>
        const fileInput = document.getElementById('uploadInput');
        const statusMsg = document.getElementById('statusMsg');
        const downloadBtn = document.getElementById('downloadBtn');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusMsg.textContent = 'وێنەکە ئامادە کرا!';
            
            // دروستکردنی لینکی ڕاستەوخۆ بۆ فایلەکە بە فۆرماتی PNG
            const fileURL = URL.createObjectURL(file);
            downloadBtn.href = fileURL;
            
            const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || 'image';
            downloadBtn.download = baseName + '.png';
            
            downloadBtn.style.display = 'block';
        });
    </script>
</body>
</html>
