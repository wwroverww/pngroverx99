<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Erest Grocery - PNG</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        "Noto Sans Arabic",
        sans-serif;

      background: #080910;
      color: white;

      padding: 35px 15px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
    }

    .card {
      background: #17181f;

      border: 1px solid #343640;

      border-radius: 28px;

      padding: 35px 25px;

      text-align: center;

      box-shadow:
        0 20px 70px rgba(0,0,0,.35);
    }

    .logo {
      direction: ltr;

      font-size: 40px;

      font-weight: 800;

      color: #c45be1;

      margin-bottom: 10px;
    }

    .subtitle {
      color: #bcbcc2;

      font-size: 17px;

      margin-bottom: 30px;
    }

    .upload-box {

      display: block;

      background: white;

      color: #111;

      border: 4px dashed #b14ddd;

      border-radius: 25px;

      padding: 38px 15px;

      cursor: pointer;

      transition: .2s;

    }

    .upload-box:hover {
      transform: scale(1.01);
    }

    .upload-title {
      font-size: 21px;
      font-weight: bold;
    }

    .upload-subtitle {
      margin-top: 10px;

      font-size: 15px;

      color: #777;
    }

    #fileInput {
      display: none;
    }

    #status {

      margin-top: 22px;

      color: #d55be5;

      font-size: 16px;

      font-weight: bold;

      min-height: 25px;
    }

    .buttons {

      margin-top: 10px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;
    }

    button {

      border: 0;

      border-radius: 12px;

      padding: 13px 22px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      color: white;

      background: #b94fda;

    }

    button:disabled {

      opacity: .35;

      cursor: not-allowed;

    }

    #downloadAll {

      background: #159447;

    }

    .progress {

      width: 100%;

      height: 8px;

      background: #292a31;

      border-radius: 20px;

      margin-top: 20px;

      overflow: hidden;

      display: none;
    }

    .progress-bar {

      height: 100%;

      width: 0%;

      background: #bd55dc;

      transition: width .3s;
    }

    #results {

      margin-top: 25px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;
    }

    .result {

      background: #282930;

      border-radius: 18px;

      padding: 12px;
    }

    .result img {

      width: 100%;

      height: 230px;

      object-fit: contain;

      background: white;

      border-radius: 12px;

      display: block;
    }

    .filename {

      color: #bdbdc4;

      font-size: 13px;

      margin: 9px 0;

      word-break: break-all;

      direction: ltr;
    }

    .download-one {

      width: 100%;

      background: #b94fda;
    }

    .footer {

      margin-top: 30px;

      color: #777;

      font-size: 14px;

      direction: ltr;
    }

    @media (max-width: 600px) {

      body {
        padding: 20px 10px;
      }

      .card {
        padding: 28px 15px;
      }

      .logo {
        font-size: 32px;
      }

      #results {
        grid-template-columns: 1fr;
      }

      .result img {
        height: 280px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        Erest grocery
      </div>

      <div class="subtitle">
        وێنەکەت بکە بە پشتی سپی
      </div>


      <!-- UPLOAD -->

      <label
        class="upload-box"
        for="fileInput"
      >

        <div class="upload-title">
          📁 وێنەکان لێرە هەڵبژێرە
        </div>

        <div class="upload-subtitle">
          تا ١٠ وێنە یەکجار
        </div>

      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
      >


      <!-- STATUS -->

      <div id="status">
        هیچ وێنەیەک هەڵنەبژێردراوە
      </div>


      <!-- BUTTONS -->

      <div class="buttons">

        <button
          id="processButton"
          disabled
        >
          ✨ سڕینەوەی پشتەوە
        </button>


        <button
          id="downloadAll"
          disabled
        >
          ⬇️ هەمووی دابەزێنە
        </button>

      </div>


      <!-- PROGRESS -->

      <div
        id="progress"
        class="progress"
      >

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>


      <!-- RESULTS -->

      <div id="results"></div>


      <div class="footer">
        rover & paiwast
      </div>

    </div>

  </div>


<script type="module">

/*
====================================================
  BACKGROUND REMOVAL LIBRARY
====================================================
*/

import {
  removeBackground
} from
"https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


/*
====================================================
  ELEMENTS
====================================================
*/

const fileInput =
  document.getElementById("fileInput");

const processButton =
  document.getElementById("processButton");

const downloadAllButton =
  document.getElementById("downloadAll");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");


/*
====================================================
  VARIABLES
====================================================
*/

let selectedFiles = [];

let processedImages = [];


/*
====================================================
  SELECT IMAGES
====================================================
*/

fileInput.addEventListener(
  "change",
  function () {

    selectedFiles =
      Array.from(
        fileInput.files
      ).slice(0, 10);


    processedImages = [];

    results.innerHTML = "";

    downloadAllButton.disabled = true;


    if (
      selectedFiles.length === 0
    ) {

      processButton.disabled = true;

      status.textContent =
        "هیچ وێنەیەک هەڵنەبژێردراوە";

      return;
    }


    processButton.disabled = false;


    status.textContent =
      selectedFiles.length +
      " وێنە هەڵبژێردراوە ✅";

  }
);


/*
====================================================
  PROCESS BUTTON
====================================================
*/

processButton.addEventListener(
  "click",
  processImages
);


async function processImages() {

  if (
    selectedFiles.length === 0
  ) {
    return;
  }


  processButton.disabled = true;

  downloadAllButton.disabled = true;

  results.innerHTML = "";

  processedImages = [];


  progress.style.display =
    "block";


  /*
  ----------------------------------------------
  PROCESS EACH IMAGE
  ----------------------------------------------
  */

  for (
    let i = 0;
    i < selectedFiles.length;
    i++
  ) {

    const file =
      selectedFiles[i];


    status.textContent =
      "خەریکی سڕینەوەی پشتەوەی وێنەی " +
      (i + 1) +
      " لە " +
      selectedFiles.length +
      "...";


    progressBar.style.width =
      (
        (i /
          selectedFiles.length) *
        100
      ) + "%";


    try {


      /*
      ------------------------------------------
      REMOVE BACKGROUND
      ------------------------------------------
      */

      const transparentBlob =
        await removeBackground(
          file,
          {

            output: {

              format: "image/png",

              quality: 1

            },

            progress:
              (
                key,
                current,
                total
              ) => {

                if (
                  key ===
                  "compute:inference"
                ) {

                  status.textContent =
                    "AI خەریکی سڕینەوەی پشتەوەیە...";

                }

              }

          }
        );


      /*
      ------------------------------------------
      ADD WHITE BACKGROUND
      ------------------------------------------
      */

      const finalPNG =
        await addWhiteBackground(
          transparentBlob
        );


      /*
      ------------------------------------------
      FILE NAME
      ------------------------------------------
      */

      const cleanName =
        file.name
          .replace(
            /\.[^/.]+$/,
            ""
          );


      const finalName =
        cleanName +
        ".png";


      /*
      ------------------------------------------
      CREATE PREVIEW
      ------------------------------------------
      */

      const imageURL =
        URL.createObjectURL(
          finalPNG
        );


      createResult(
        imageURL,
        finalPNG,
        finalName
      );


      /*
      ------------------------------------------
      SAVE
      ------------------------------------------
      */

      processedImages.push({

        blob: finalPNG,

        name: finalName

      });


    }
    catch (error) {

      console.error(
        "Background removal error:",
        error
      );


      const errorBox =
        document.createElement(
          "div"
        );

      errorBox.style.color =
        "#ff6b6b";

      errorBox.style.padding =
        "10px";


      errorBox.textContent =
        "❌ وێنەی " +
        (i + 1) +
        " نەکرا";


      results.appendChild(
        errorBox
      );

    }

  }


  /*
  ----------------------------------------------
  COMPLETE
  ----------------------------------------------
  */

  progressBar.style.width =
    "100%";


  if (
    processedImages.length > 0
  ) {

    status.textContent =
      "تەواو بوو ✅ " +
      processedImages.length +
      " وێنە";

    downloadAllButton.disabled =
      false;

  }
  else {

    status.textContent =
      "هیچ وێنەیەک نەکرا ❌";

  }


  processButton.disabled =
    false;

}


/*
====================================================
  ADD WHITE BACKGROUND
====================================================
*/

async function addWhiteBackground(
  transparentBlob
) {

  const imageURL =
    URL.createObjectURL(
      transparentBlob
    );


  const image =
    new Image();


  await new Promise(
    (
      resolve,
      reject
    ) => {

      image.onload =
        resolve;

      image.onerror =
        reject;

      image.src =
        imageURL;

    }
  );


  /*
  ----------------------------------------------
  CANVAS
  ----------------------------------------------
  */

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    image.naturalWidth;

  canvas.height =
    image.naturalHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
  ----------------------------------------------
  WHITE BACKGROUND
  ----------------------------------------------
  */

  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  ----------------------------------------------
  PUT CUTOUT ON WHITE
  ----------------------------------------------
  */

  ctx.drawImage(
    image,
    0,
    0
  );


  URL.revokeObjectURL(
    imageURL
  );


  /*
  ----------------------------------------------
  EXPORT PNG
  ----------------------------------------------
  */

  return await new Promise(
    resolve => {

      canvas.toBlob(
        blob => {

          resolve(blob);

        },
        "image/png",
        1
      );

    }
  );

}


/*
====================================================
  CREATE RESULT CARD
====================================================
*/

function createResult(
  imageURL,
  blob,
  filename
) {

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "result";


  const image =
    document.createElement(
      "img"
    );

  image.src =
    imageURL;


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "filename";

  name.textContent =
    filename;


  const button =
    document.createElement(
      "button"
    );

  button.className =
    "download-one";

  button.textContent =
    "⬇️ Download PNG";


  button.addEventListener(
    "click",
    function () {

      downloadBlob(
        blob,
        filename
      );

    }
  );


  box.appendChild(
    image
  );


  box.appendChild(
    name
  );


  box.appendChild(
    button
  );


  results.appendChild(
    box
  );

}


/*
====================================================
  DOWNLOAD ONE
====================================================
*/

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/*
====================================================
  DOWNLOAD ALL
====================================================
*/

downloadAllButton.addEventListener(
  "click",
  async function () {

    if (
      processedImages.length === 0
    ) {
      return;
    }


    status.textContent =
      "خەریکی دابەزاندنی وێنەکانە...";


    for (
      const image
      of processedImages
    ) {

      downloadBlob(
        image.blob,
        image.name
      );


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            500
          )
      );

    }


    status.textContent =
      "هەموو وێنەکان دابەزێنرا ✅";

  }
);

</script>

</body>
</html>
